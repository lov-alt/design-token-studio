<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f0f1a"/><stop offset="100%" stop-color="#1a1a2e"/></linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#4ade80"/></linearGradient>
  </defs>
  <rect width="900" height="500" fill="url(#bg)" rx="12"/>

  <!-- Dashboard cards -->
  <text x="30" y="36" fill="#fff" font-family="sans-serif" font-size="18" font-weight="300">Design Token Studio</text>
  <text x="30" y="54" fill="#666" font-family="sans-serif" font-size="10">13 colors · 6 type styles · 8 spacing tokens</text>

  <!-- Color Palette row -->
  <text x="30" y="84" fill="#555" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="1">COLOR PALETTE</text>
  <rect x="30" y="92" width="32" height="32" fill="url(#purple)" rx="8"/>
  <rect x="67" y="92" width="32" height="32" fill="url(#purple)" rx="8" opacity="0.7"/>
  <rect x="104" y="92" width="32" height="32" fill="#1e1b4b" rx="8"/>
  <rect x="141" y="92" width="32" height="32" fill="url(#pink)" rx="8"/>
  <rect x="178" y="92" width="32" height="32" fill="#fff" rx="8" stroke="#333" stroke-width="0.5"/>
  <rect x="215" y="92" width="32" height="32" fill="#18181b" rx="8"/>
  <rect x="252" y="92" width="32" height="32" fill="url(#green)" rx="8"/>
  <rect x="289" y="92" width="32" height="32" fill="#f59e0b" rx="8"/>
  <rect x="326" y="92" width="32" height="32" fill="#ef4444" rx="8"/>
  <rect x="363" y="92" width="32" height="32" fill="#3b82f6" rx="8"/>

  <!-- Module cards -->
  <a href="#colors">
    <rect x="30" y="148" width="400" height="64" fill="#1e1e32" rx="12"/>
    <text x="50" y="174" fill="#fff" font-family="sans-serif" font-size="13" font-weight="500">Colors</text>
    <text x="50" y="192" fill="#666" font-family="sans-serif" font-size="10">Brand wizard · Tonal scale · Semantic tokens · Dark theme</text>
    <circle cx="410" cy="180" r="14" fill="url(#purple)"/>
    <text x="410" y="184" fill="#fff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">◉</text>
  </a>

  <a href="#typography">
    <rect x="470" y="148" width="400" height="64" fill="#1e1e32" rx="12"/>
    <text x="490" y="174" fill="#fff" font-family="sans-serif" font-size="13" font-weight="500">Typography</text>
    <text x="490" y="192" fill="#666" font-family="sans-serif" font-size="10">Font family · Type scale · Line height · Letter spacing</text>
    <circle cx="850" cy="180" r="14" fill="#22c55e"/>
    <text x="850" y="184" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">T</text>
  </a>

  <rect x="30" y="228" width="400" height="64" fill="#1e1e32" rx="12"/>
  <text x="50" y="254" fill="#fff" font-family="sans-serif" font-size="13" font-weight="500">Spacing &amp; Effects</text>
  <text x="50" y="272" fill="#666" font-family="sans-serif" font-size="10">Spacing system · Shadow elevations · Border radius</text>
  <circle cx="410" cy="260" r="14" fill="#f59e0b"/>
  <text x="410" y="264" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">↔</text>

  <rect x="470" y="228" width="400" height="64" fill="#1e1e32" rx="12"/>
  <text x="490" y="254" fill="#fff" font-family="sans-serif" font-size="13" font-weight="500">Accessibility</text>
  <text x="490" y="272" fill="#666" font-family="sans-serif" font-size="10">WCAG contrast · CVD simulation · Palette audit</text>
  <circle cx="850" cy="260" r="14" fill="#ef4444"/>
  <text x="850" y="264" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">♿</text>

  <!-- Export section -->
  <text x="30" y="328" fill="#555" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="1">EXPORT FORMATS</text>
  <rect x="30" y="338" width="95" height="28" fill="#1e1e32" rx="6"/>
  <text x="77" y="356" fill="#6366f1" font-family="monospace" font-size="9" font-weight="500" text-anchor="middle">CSS</text>
  <rect x="132" y="338" width="95" height="28" fill="#1e1e32" rx="6"/>
  <text x="179" y="356" fill="#888" font-family="monospace" font-size="9" text-anchor="middle">JSON</text>
  <rect x="234" y="338" width="95" height="28" fill="#1e1e32" rx="6"/>
  <text x="281" y="356" fill="#888" font-family="monospace" font-size="9" text-anchor="middle">Tailwind</text>
  <rect x="336" y="338" width="95" height="28" fill="#1e1e32" rx="6"/>
  <text x="383" y="356" fill="#888" font-family="monospace" font-size="9" text-anchor="middle">SCSS</text>
  <rect x="438" y="338" width="95" height="28" fill="#1e1e32" rx="6"/>
  <text x="485" y="356" fill="#888" font-family="monospace" font-size="9" text-anchor="middle">SwiftUI</text>
  <rect x="540" y="338" width="95" height="28" fill="#1e1e32" rx="6"/>
  <text x="587" y="356" fill="#888" font-family="monospace" font-size="9" text-anchor="middle">Flutter</text>

  <!-- Code preview -->
  <rect x="30" y="380" width="840" height="100" fill="#1a1a2e" rx="8"/>
  <circle cx="50" cy="400" r="4" fill="#ef4444" opacity="0.5"/>
  <circle cx="64" cy="400" r="4" fill="#f59e0b" opacity="0.5"/>
  <circle cx="78" cy="400" r="4" fill="#22c55e" opacity="0.5"/>
  <text x="50" y="422" fill="#a5b4fc" font-family="monospace" font-size="10">:root {</text>
  <text x="62" y="438" fill="#86efac" font-family="monospace" font-size="10">--color-primary</text><text x="174" y="438" fill="#888" font-family="monospace" font-size="10">: </text><text x="186" y="438" fill="#fbbf24" font-family="monospace" font-size="10">#6366f1</text><text x="222" y="438" fill="#888" font-family="monospace" font-size="10">;</text>
  <text x="62" y="454" fill="#86efac" font-family="monospace" font-size="10">--color-surface</text><text x="174" y="454" fill="#888" font-family="monospace" font-size="10">: </text><text x="186" y="454" fill="#fbbf24" font-family="monospace" font-size="10">#ffffff</text><text x="222" y="454" fill="#888" font-family="monospace" font-size="10">;</text>
  <text x="62" y="470" fill="#86efac" font-family="monospace" font-size="10">--font-body</text><text x="154" y="470" fill="#888" font-family="monospace" font-size="10">: </text><text x="166" y="470" fill="#fbbf24" font-family="monospace" font-size="10">400 1rem/1.6 'Inter'</text><text x="290" y="470" fill="#888" font-family="monospace" font-size="10">;</text>
  <text x="50" y="488" fill="#a5b4fc" font-family="monospace" font-size="10">}</text>
</svg>
